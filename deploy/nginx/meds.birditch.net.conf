# meds.birditch.net → Next.js on 127.0.0.1:28100 (BT-panel nginx, written by hand; see docs/deploy.md).
# Installed as /www/server/panel/vhost/nginx/meds.birditch.net.conf.

server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;
    server_name meds.birditch.net;

    # Cloudflare Origin CA (*.birditch.net). Only Cloudflare trusts it: the proxy must stay on.
    ssl_certificate    /www/server/panel/vhost/cert/share.birditch.net/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/share.birditch.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Alt-Svc 'h3=":443"; ma=86400';
    error_page 497  https://$host$request_uri;

    # Cloudflare reuses origin connections for up to 900s; outlive that to avoid 520s.
    keepalive_timeout 905s;

    # Cloudflare only (Access lives there). real_ip below rewrites $remote_addr only for
    # Cloudflare's ranges, so an unchanged address means a direct hit: close without answering.
    if ($realip_remote_addr = $remote_addr) {
        return 444;
    }

    #HTTP_TO_HTTPS_START
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }
    #HTTP_TO_HTTPS_END

    # https://www.cloudflare.com/ips/
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # The app's own health probe is for the host; keep it off the public hostname.
    location = /api/health {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:28100;
        proxy_http_version 1.1;
        # Host and Origin must agree for Server Actions' CSRF check.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # proxy.conf enables proxy_cache globally; this is per-visitor data, never cache it here.
        proxy_cache off;
        proxy_buffering off;
        client_max_body_size 1m;
        add_header Strict-Transport-Security "max-age=31536000";
        add_header Alt-Svc 'h3=":443"; ma=86400';
    }

    access_log  /www/wwwlogs/meds.birditch.net.log;
    error_log  /www/wwwlogs/meds.birditch.net.error.log;
}
